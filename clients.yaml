# Client slug -> Notion "Clients" DB page id.
#
# `scrape.py --client <slug> --upload-drive` looks the slug up here to find the
# Notion page, then reads that page's "Google Drive ID" property to know which
# Drive to upload into. The Drive ID itself lives in Notion (single source of
# truth), so onboarding a client is: create their Clients row, fill in
# "Google Drive ID", then add a slug here pointing at the row.
#
# To find a page id: open the client's row in Notion, Share -> Copy link; the
# 32-hex-char tail of the URL is the page id (dashed or undashed both work).
#
# Slugs are lowercase, no spaces. The two "Midtown" clients are disambiguated
# as midtown-dental (Studio on Eglinton) and midtown-ortho (Orthodontics).

clients:
  sovrle:
    name: Sovrle Dental
    page_id: 291d7103-1902-802b-8d07-f67e2f9ce6f9

  scarborosmiles:
